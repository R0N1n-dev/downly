<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>login</title>
  <!-- Instagram's logged-out shell marks the page itself as a WebPage: its image is the app icon,
       so the extractor must skip this block and use og:image instead -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Instagram",
    "url": "https://www.instagram.com/p/WEBPAGECODE/",
    "image": "https://static.cdninstagram.com/rsrc.php/v3/instagram-logo.png"
  }
  </script>
  <meta property="og:image" content="https://scontent.cdninstagram.com/v/t51.2885-15/900000001_910000001_n.jpg?stp=dst-jpg_s640x640&amp;oe=65A1B2E1">
</head>
<body></body>
</html>
